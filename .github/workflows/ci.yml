name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate` and the Next.js build succeed —
      # this job never touches a real database or sends real email.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
      JWT_SECRET: "ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      # `next build` type-checks on its own (and generates Next's own route
      # types like LayoutProps first) — a separate `tsc --noEmit` run before
      # this would fail on those not existing yet, so this is the only
      # build/type-check step.
      - run: npm run build
